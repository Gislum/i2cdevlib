<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi Robot Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Robot Control</h1>
        <div id="status-message">Status: Idle</div>
        <div id="controls">
            <div class="button-row">
                <button id="btn-forward" class="control-button">Forward</button>
            </div>
            <div class="button-row">
                <button id="btn-left" class="control-button">Turn Left</button>
                <button id="btn-stop" class="control-button stop">Stop</button>
                <button id="btn-right" class="control-button">Turn Right</button>
            </div>
            <div class="button-row">
                <button id="btn-backward" class="control-button">Backward</button>
            </div>
        </div>
    </div>

    <!-- JavaScript will be added here later -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = {
                'forward': document.getElementById('btn-forward'),
                'backward': document.getElementById('btn-backward'),
                'left': document.getElementById('btn-left'),
                'right': document.getElementById('btn-right'),
                'stop': document.getElementById('btn-stop')
            };
            const statusMessage = document.getElementById('status-message');

            const sendCommand = (direction) => {
                statusMessage.textContent = `Sending: ${direction}...`;
                fetch(`/move/${direction}`)
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        statusMessage.textContent = `Status: ${data.action} command received.`;
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        statusMessage.textContent = 'Error: Could not connect to server.';
                    });
            };

            for (const [direction, button] of Object.entries(buttons)) {
                if (button) {
                    button.addEventListener('click', function(event) {
                        event.preventDefault(); // Prevent form submission or page reload
                        sendCommand(direction);
                    });
                }
            }
        });
    </script>
</body>
</html>
